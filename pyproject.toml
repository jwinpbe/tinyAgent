[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tiny-agent-os"
version = "1.2.28"
description = "Python agent loop"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Fabian"}]
keywords = ["agent", "llm", "openrouter", "streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "niquests>=3.0.0",
    "msgspec>=0.18.0",
]

[project.optional-dependencies]
examples = [
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "hypothesis>=6.0.0",
    "python-dotenv>=1.0.0",
    "grimp>=3.0",
    "vulture>=2.11.0",
    "pylint>=3.0.0",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/**",
    "/rust/**",
    "/scripts/**",
    "/tests/**",
    "/docs/**",
    "/examples/**",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tinyagent"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
preview = true

[tool.ruff.lint]
ignore = [
    "UP007",   # Allow Union[] for TypeAlias compatibility
    "SIM117",  # Nested with statements can be more readable for async context managers
]
extend-select = ["FURB"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["tinyagent"]

[tool.pyrefly]
replace_imports_with_any = ["msgspec"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
files = ["."]
exclude = '(^|/)(\.venv|scripts/)'
explicit_package_bases = true
mypy_path = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.lint]
max-file-lines = 500

[tool.archlint]
library_root = "src/tinyagent"
core_modules = [
    "agent",
    "agent_loop",
    "agent_tool_execution",
    "agent_types",
    "openrouter_provider",
    "proxy",
    "proxy_event_handlers",
]
nih_filenames = ["dotenv.py", "six.py", "compat.py"]
