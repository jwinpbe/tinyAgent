[package]
name = "tinyagent-alchemy"
version = "0.1.0"
edition = "2024"

[lib]
name = "_alchemy"
crate-type = ["cdylib", "rlib"]

[dependencies]
alchemy-llm = "0.2.0"
futures = "0.3.32"
# Same rustls TLS stack as the vendored alchemy-llm crate, so no system
# OpenSSL is needed at runtime.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
pyo3 = { version = "0.28.2", features = ["abi3-py310", "extension-module"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# "macros" is needed only by #[tokio::test] for the image-URL unit tests.
tokio = { version = "1.50.0", features = ["rt-multi-thread", "sync", "macros"] }

[patch.crates-io]
alchemy-llm = { path = "../vendor/alchemy-llm" }
